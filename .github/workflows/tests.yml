name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gano_ai
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: gano_ai_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, pdo_pgsql, mbstring, bcmath, gd
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Create .env
        # No .env.example is committed (deliberately — see README); phpunit.xml supplies every
        # env var the test run actually needs, this just gives artisan a file to write the
        # generated APP_KEY into.
        run: touch .env

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Install Node dependencies and build assets
        run: |
          npm ci
          npm run build

      - name: Wait for Postgres
        run: |
          until pg_isready -h 127.0.0.1 -p 5433 -U gano_ai; do sleep 1; done

      - name: Run tests
        run: php artisan test
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
          DB_DATABASE: gano_ai_test
          DB_USERNAME: gano_ai
          DB_PASSWORD: secret
